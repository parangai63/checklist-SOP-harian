  /* ================= BUKU STOK SUPPLIER (pastry, tiramisu, dan supplier lain) =================
     Setiap kejadian dicatat satu baris: in = restok masuk, rt = return ke supplier, cn = hitung sisa.
     Stok sekarang = hitungan sisa terakhir + restok sesudahnya - return sesudahnya.
     Terjual antara dua hitungan = hitungan awal + masuk - return - hitungan akhir.
     Sumber baris: man (diisi di menu ini), tk (turunan Tutup Kasir), lap (laporan restok lama). Yang man/lap menang atas tk di hari yang sama. */
  var STORD={in:0,rt:1,cn:2};
  function stDimsOf(u){return (u.jn&&u.jn.length)?u.jn.map(function(n){return jslug(n);}):['_t'];}
  function stShDef(sh){return sh==='sr'?'21:30':'15:00';}
  /* semua baris efektif satu supplier, urut waktu */
  function stSorted(u){
    var rows=[],ids={},manDay={};
    Object.keys(S.kn).forEach(function(k){
      if(k.indexOf('g_')!==0)return;var e=S.kn[k];if(!e||e.s!==u.id)return;
      ids[k]=1;if(e.x)return;

  /* ================= CETAK LABEL (printer thermal 58 mm lewat Bluetooth) =================
     Logika sambung dan kirim data dipakai dari halaman Prep Checker milik Bachtiar yang sudah terbukti jalan di EPPOS RPP02.
     Di dalam web Apps Script, Chrome bisa memblokir Bluetooth. Kalau diblokir, tombol cadangan membuka halaman cetak terpisah dengan data yang sama. */
  var PT_SVC='000018f0-0000-1000-8000-00805f9b34fb',PT_CHR='00002af1-0000-1000-8000-00805f9b34fb';
  var PT_URL='https://precious-hamster-157d75.netlify.app/';
  var ptChar=null,ptDev=null,ptStatus='',ptJob=null,ptCopies=1,ptBusy=false;
  function ptUrl(){return (S.cfg&&S.cfg.pu)||PT_URL;}
  function ptSupport(){
    var r={ok:true,why:'',bt:typeof navigator!=='undefined'&&!!navigator.bluetooth,sec:typeof isSecureContext!=='undefined'?!!isSecureContext:null,frame:false,pol:null};
    try{r.frame=window.self!==window.top;}catch(e){r.frame=true;}
    try{var fp=document.featurePolicy||document.permissionsPolicy;if(fp&&fp.allowsFeature)r.pol=!!fp.allowsFeature('bluetooth');}catch(e){}
    if(!r.bt){r.ok=false;r.why='Browser ini tidak punya Web Bluetooth. Pakai Chrome di Android.';}
    else if(r.pol===false){r.ok=false;r.why='Bluetooth diblokir untuk halaman ini (permissions policy), biasanya karena web berjalan di dalam bingkai Apps Script.';}
    return r;
  }
  function ptAscii(t){return String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/[^\x20-\x7E]/g,'');}
  function ptWrap(label,val,w){
    var pre=(label+'          ').slice(0,8),rest=ptAscii(val)||'-',lines=[],room=w-8;
    while(rest.length>room){var cut=rest.lastIndexOf(' ',room);if(cut<8)cut=room;lines.push(rest.slice(0,cut));rest=rest.slice(cut).replace(/^\s+/,'');}
    lines.push(rest);
    return lines.map(function(l,i){return (i?'        ':pre)+l;});
  }
  function ptDate(d){if(!d||!validDate(d))return '-';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
  /* isi label sebagai teks 32 kolom */
  function ptLines(job){
    var W=32,L=[],bar=new Array(W+1).join('-');
    L.push(bar);L.push('        KOPI PARANG PREP');L.push(bar);
    [['SKU',job.sku],['ITEM',job.n],['BATCH',job.vol],['PROD',ptDate(job.mfg)],['EXP',ptDate(job.exp)],['PIC',job.pic]].forEach(function(r){
      if(r[0]==='PROD'&&!job.mfg)return;ptWrap(r[0],r[1],W).forEach(function(x){L.push(x);});
    });
    if(job.bt)L.push('KODE  : '+ptAscii(job.bt).slice(0,24));
    L.push(bar);L.push('    Tempelkan pada container');
    return L;
  }
  function ptBytes(job,copies){
    var enc=new TextEncoder(),parts=[],tot=0;
    function put(u8){parts.push(u8);tot+=u8.length;}
    put(new Uint8Array([0x1B,0x40]));
    for(var c=0;c<copies;c++){
      ptLines(job).forEach(function(l){
        var bold=/^EXP /.test(l);
        if(bold)put(new Uint8Array([0x1B,0x45,1]));
        put(enc.encode(l+'\n'));
        if(bold)put(new Uint8Array([0x1B,0x45,0]));
      });
      put(enc.encode('\n\n\n'));
    }
    var out=new Uint8Array(tot),o=0;parts.forEach(function(p){out.set(p,o);o+=p.length;});return out;
  }

  async function ptConnect(){

    var srv=await dev.gatt.connect(),svc=await srv.getPrimaryService(PT_SVC);

  async function ptSend(bytes){
    if(!ptChar)throw new Error('Printer belum terhubung.');
    for(var i=0;i<bytes.length;i+=100){
      var ch=bytes.slice(i,i+100);
      if(ptChar.writeValue)await ptChar.writeValue(ch);else await ptChar.writeValueWithoutResponse(ch);
    }
  }

  /* ================= LAPORAN =================
     Restok pastry, restok tiramisu, belanja, barang rusak, kendala, dan isi dompet belanja.
     Disimpan di S.kn['l_<tanggal>_<id>']. Saldo dompet = isi dompet dikurangi belanja. */
  var LAP=[
    {id:'ps',n:'Restok pastry',d:'Pastry yang baru masuk atau diisi ulang'},
    {id:'tr',n:'Restok tiramisu',d:'Tiramisu yang baru masuk atau diisi ulang'},
    {id:'bl',n:'Belanja',d:'Belanja di jam operasional, memotong dompet belanja'},
    {id:'rs',n:'Barang rusak',d:'Barang pecah, rusak, atau hilang'},
    {id:'kd',n:'Kendala',d:'Masalah fasilitas, mis. AC bocor'},
    {id:'ws',n:'Waste',d:'Kalibrasi espresso dan filter, waste menu, waste prepare'},
    {id:'cu',n:'Pelanggan loyal',d:'Data pelanggan: nama, nomor HP, favorit, alergi'},
    {id:'ev',n:'Event dan task',d:'Event, meeting, reservasi, task khusus, pengumuman'}
  ];
  /* Waste: satu laporan, empat sub-menu. Kalibrasi espresso dihitung 20 g beans per pull shot (dose 18 sampai 19,5 g dibulatkan ke atas). */
  var WS_SUB=[['ke','Kalibrasi espresso'],['kf','Kalibrasi filter'],['wm','Waste menu'],['wp','Waste prepare']];
  var WS_WHY=[['tumpah','Tumpah'],['salah','Salah buat'],['exp','Kedaluwarsa'],['tester','Tester'],['gosong','Gosong']];
  var WS_SHOT_G=20;
  function wsSubLabel(k){for(var i=0;i<WS_SUB.length;i++)if(WS_SUB[i][0]===k)return WS_SUB[i][1];return 'Waste';}
  function wsWhyLabel(k){if(k==='kal')return 'Kalibrasi';for(var i=0;i<WS_WHY.length;i++)if(WS_WHY[i][0]===k)return WS_WHY[i][1];return '';}
  /* gram beans yang terpakai: espresso = pull shot x 20 g, filter = dose */
  function wsGrams(e){return e.k==='ke'?(e.q||0)*WS_SHOT_G:(e.k==='kf'?(e.g||0):0);}
  function wsBeanName(e){
    var n='';
    if(e.bi){if(e.bi.indexOf('e_')===0){var x=S.kn[e.bi];if(x&&x.n)n=x.n;}else if(e.bi.indexOf('b_')===0){var b=beanOf(e.bi.slice(2));if(b)n=b.fn||b.n;}}
    return n||e.i||'-';
  }
  function wsNum(v){return String(Math.round(v*10)/10).replace('.',',');}
  var LAPN={};LAP.concat([{id:'dp',n:'Isi dompet'}]).forEach(function(x){LAPN[x.id]=x.n;});
  var LOW_WALLET=50000;
  var lpForm='',lpDraft={},lpMsg='',lpOk='',lpFromKal=false;
  /* pintasan dari panel Kalibrasi: buka form Waste langsung di sub-menu kalibrasi */
  function lpOpenWs(k){lpForm='ws';lpDraft={k:k};lpMsg='';lpFromKal=true;showTab('laporan');window.scrollTo(0,0);}
  function lpAll(){
    var out=[];Object.keys(S.kn).forEach(function(k){if(k.indexOf('l_')!==0)return;var e=S.kn[k];if(e&&!e.x)out.push({id:k,e:e});});
    out.sort(function(a,b){return a.e.d<b.e.d?1:a.e.d>b.e.d?-1:((b.e.a||'')<(a.e.a||'')?-1:((b.e.a||'')>(a.e.a||'')?1:(b.e.u-a.e.u)));});
    return out;
  }
  function lpSaldo(){var s=0;lpAll().forEach(function(x){if(x.e.t==='dp')s+=x.e.m;else if(x.e.t==='bl')s-=x.e.m;});return s;}
  function lpOpenKd(){return lpAll().filter(function(x){return x.e.t==='kd'&&x.e.st!=='sel';});}
  function lpShift(D){var a=myAtt(D,me.id).filter(function(x){return !x.b;})[0];return a?a.sh:(nowBiz()<minOf('15:00')?'pg':'sr');}
  function lpAdd(f){
    var D=today(),id='l_'+D+'_'+idn();
    var d={t:f.t,d:D,sh:lpShift(D),b:me.id,a:clockT(),i:f.i||'',q:f.q||0,m:f.m||0,ar:f.ar||'',n:f.n||'',st:'',sb:'',sa:'',sn:'',x:0,bt:f.bt||'',j:f.j||{}};
    if(f.t==='ws'){d.k=f.k||'wm';d.bi=f.bi||'';d.g=f.g||0;d.rs=f.rs||'';}
    return setKn(id,d)?id:'';
  }
  function lpCan(x){return x.e.b===me.id&&x.e.d===today()||isHead(me)||me.ad;}
  /* rincian per jenis untuk restok pastry: "Almond croissant 2, Ham n cheese 3" */
  function lpSup(name){var r=null;SUPS().forEach(function(u){if(u.n===name)r=u;});return r;}
  function lpJenisText(e){
    if(!e||!e.j||!Object.keys(e.j).length)return '';
    var u=lpSup(e.i),out=[],seen={};
    ((u&&u.jn)||[]).forEach(function(nm){var v=e.j[jslug(nm)];if(v){out.push(nm+' '+v);}seen[jslug(nm)]=1;});
    Object.keys(e.j).forEach(function(k){if(!seen[k]&&e.j[k])out.push(k+' '+e.j[k]);});
    return out.join(', ');
  }
  function wsUnit(id){var u='';PREPS().forEach(function(x){if(x.id===id)u=prepUn(x);});return u||'porsi';}
  function lpAreaLabel(a){return a&&own(AR,a)?AR[a].label:'';}
  function lpDesc(e){
    var p=[];
    if(e.t==='ps'||e.t==='tr'){p.push((e.i||'-')+' '+e.q);var jt=lpJenisText(e);if(jt)p.push(jt);if(e.bt)p.push(e.bt);}
    else if(e.t==='bl')p.push((e.i||'-')+' '+rp(e.m));
    else if(e.t==='rs')p.push((e.i||'-')+' '+e.q+(e.ar?' · '+lpAreaLabel(e.ar):''));
    else if(e.t==='kd')p.push((e.ar?lpAreaLabel(e.ar)+': ':'')+e.n);
    else if(e.t==='dp')p.push('Isi dompet '+rp(e.m));
    else if(e.t==='ws'){
      p.push(wsSubLabel(e.k)+': '+(e.k==='ke'||e.k==='kf'?wsBeanName(e):(e.i||'-')));
      if(e.k==='ke')p.push(e.q+' pull shot (sekitar '+wsGrams(e)+' g)');
      else if(e.k==='kf')p.push('dose '+wsNum(e.g)+' g');
      else p.push(e.q+(e.k==='wp'?' '+wsUnit(e.bi):' pcs'));
      if(e.rs&&e.rs!=='kal')p.push(wsWhyLabel(e.rs));
    }
    if(e.n&&e.t!=='kd')p.push(e.n);
    return p.join(' · ');
  }
  /* untuk serah terima: laporan yang dicatat pada shift itu, kendala terbuka, saldo dompet */
  /* restok dari buku stok supplier, ditampilkan di serah terima seperti laporan restok */
  function lpHandStok(day,sh){
    var out=[];
    SUPS().forEach(function(u){
      stSorted(u).forEach(function(x){
        var e=x.e;if(e.t!=='in'||e.d!==day||!(e.q>0))return;
        var xs=x.sh||((e.a||'12:00')<'15:00'?'pg':'sr');if(xs!==sh)return;
        out.push({key:x.id,e:{t:/pastry/i.test(u.k||'')?'ps':'tr',d:day,sh:sh,i:u.n,q:e.q,j:e.j,bt:e.bt,b:e.b,a:e.a,n:e.nt,x:0}});
      });
    });
    return out;
  }
  function lpHandover(day,sh){
    return {
      lap:lpAll().filter(function(x){return x.e.d===day&&x.e.sh===sh&&x.e.t!=='kd'&&x.e.t!=='dp'&&x.e.t!=='ps'&&x.e.t!=='tr';}).concat(lpHandStok(day,sh)),
      kd:lpOpenKd(),saldo:lpSaldo(),adaDompet:lpAll().some(function(x){return x.e.t==='dp';})
    };
  }
  function renderLaporan(){

    if(lpForm){lapForm(box,D);return;}
    if(lpOk){box.appendChild(h('div',{cls:'banner info',id:'lapOk',text:lpOk}));lpOk='';}

    var sal=lpSaldo(),adaD=lpAll().some(function(x){return x.e.t==='dp';});

    wc.appendChild(h('p',{cls:'lap-sal',id:'lapSaldo',text:adaD?rp(sal):'Belum diisi'}));
    wc.appendChild(h('p',{cls:'small muted',text:adaD?'Sisa uang belanja. Setiap Belanja memotong saldo ini.':'Head isi dompet dulu supaya sisa uang belanja terlihat.'}));
    if(isHead(me)||me.ad){
      var db=h('button',{type:'button',cls:'btn quiet',id:'bLapDp',text:'Isi dompet'});
      db.addEventListener('click',function(){lpForm='dp';lpDraft={};lpMsg='';renderLaporan();window.scrollTo(0,0);});wc.appendChild(db);
    }
    box.appendChild(wc);
    /* kendala terbuka */
    var kd=lpOpenKd();
    var kc=h('div',{cls:'card'+(kd.length?' warn':''),id:'lapKd'});
    kc.appendChild(h('div',{cls:'who'},h('h3',{text:'Kendala terbuka'}),h('span',{cls:'st '+(kd.length?'ajukan':'setuju'),text:kd.length?kd.length+' belum selesai':'tidak ada'})));
    kd.forEach(function(x){kc.appendChild(lapRow(x,true));});

      b.appendChild(h('div',null,h('b',{text:t.n}),h('small',{text:t.d})));

      grid.appendChild(b);
    });
    box.appendChild(grid);
    /* riwayat */
    var all=lpAll().filter(function(x){return x.e.t!=='kd'||x.e.st==='sel';}).slice(0,25);
    var hc=h('div',{cls:'card',id:'lapHist'});hc.appendChild(h('h3',{text:'Riwayat terbaru'}));
    if(!all.length)hc.appendChild(h('p',{cls:'small muted',text:'Belum ada laporan.'}));
    all.forEach(function(x){hc.appendChild(lapRow(x,false));});

  }
  function lapRow(x,open){

      i.addEventListener('input',function(){f[key]=i.value;});return h('label',{cls:'f'},label,i);

    var a=new Date(y,m-1,d),b=new Date(y,t.getMonth(),t.getDate());

  function cuSave(f,id){
    var nm=(f.n||'').trim(),ph=cuPh(f.p);

    var dup=null;cuAll().forEach(function(x){if(x.id!==id&&x.e.p===ph)dup=x.e;});
    if(dup)return 'Nomor ini sudah terdaftar atas nama '+dup.n+'. Cari namanya di daftar, lalu pakai Ubah.';
    var bd='';
    if(f.bdd||f.bdm){
      var dd=parseInt(f.bdd,10),mm=parseInt(f.bdm,10);
      if(!(dd>=1&&dd<=31)||!(mm>=1&&mm<=12))return 'Ulang tahun: isi tanggal dan bulan dua-duanya, atau kosongkan dua-duanya.';
      bd=(mm<10?'0':'')+mm+'-'+(dd<10?'0':'')+dd;
    }
    if(!f.cs)return 'Centang dulu: pelanggan setuju datanya disimpan.';
    var patch={n:nm,p:ph,bd:bd,fv:f.fv||'',pf:f.pf||'',al:f.al||'',sr:f.sr||'',cs:1,nt:f.nt||''};
    if(id){setKn(id,patch);return '';}

  /* ================= RAPORT =================

  var RP_STAFF_SUB=false;   /* true = staf biasa juga boleh membuka sub-raport */
  var RP_SPAN_ARC=130;      /* rentang terpanjang (hari) yang boleh memuat detail dari arsip */
  var RPS=[

    {id:'mt',n:'Maintenance dan langganan',d:'Service, langganan, jatuh tempo, dan biaya'}
  ];
  var rpRange={k:'7',f:'',t:''},rpView='',rpSort={c:-1,d:1},rpQ='',rpLim=100,rpMsg='',rpCopyTxt='';
  var arcMonths=null,arcLoaded={},arcBusy=false,arcFail='',arcRetried=false;

  /* ---------- ringkasan harian ---------- */
  function smBuild(D){
    var d=dayOf(D);if(!d)return null;
    var st=dayStats(D),lt=0,ea=0,rt=0,hadir=0,telat=0,pr={};
    SHIFTS.forEach(function(sh){var x=st.sh[sh.id];if(x&&x.active){lt+=x.late;ea+=x.early;rt+=x.ret;}});
    Object.keys(d.att).forEach(function(k){
      var a=d.att[k];if(!attOk(a)||!a.a)return;
      hadir++;var l=attLate(a)?1:0;telat+=l;
      var r=pr[a.uid]||(pr[a.uid]=[0,0,0]);r[0]++;r[1]+=l;
    });
    Object.keys(d.en).forEach(function(k){
      var e=d.en[k];if(!e||e.s!=='o'||!e.b)return;
      var r=pr[e.b]||(Object.keys(pr).length<40?(pr[e.b]=[0,0,0]):null);if(r)r[2]++;
    });
    var kn=0,ksel=0,knz=0,kset=0;
    SHIFTS.forEach(function(sh){
      var k=d.kc[kcKey(sh.id,'tk')];
      if(k&&typeof k.fz==='number'&&typeof k.tn==='number'){var c=kasCalc(k);kn++;ksel+=c.selisih||0;if(c.selisih)knz++;kset+=c.setoran||0;}
    });
    var kb=0,pp=0;
    Object.keys(d.kb).forEach(function(k){if(!d.kb[k].x)kb++;});
    Object.keys(d.pp).forEach(function(k){if(!d.pp[k].x)pp++;});
    if(!st.active&&!hadir&&!kn&&!kb&&!pp)return null;
    return cleanSm({c:[st.done,st.total],lt:lt,ea:ea,rt:rt,h:[hadir,telat],ks:[kn,ksel,knz,kset],kb:kb,pp:pp,pr:pr,u:0});
  }
  function smKey(x){return stable({c:x.c,lt:x.lt,ea:x.ea,rt:x.rt,h:x.h,ks:x.ks,kb:x.kb,pp:x.pp,pr:x.pr});}
  /* simpan ringkasan hari yang sudah lewat. cut = batas arsip: semua hari sebelum cut diringkas ulang sebelum dibuang */
  function smSync(cut){
    var T=today(),ch=false;
    Object.keys(S.days).forEach(function(D){
      if(!validDate(D))return;
      var isCut=!!cut&&D<cut;
      if(!isCut&&D>=T)return;
      var old=S.sm[D];
      if(old&&!isCut&&diffDays(D,T)>14)return;
      var n=smBuild(D);if(!n)return;
      if(old&&smKey(old)===smKey(n))return;
      n.u=now();S.sm[D]=n;ch=true;
    });
    return ch;
  }
  function smSyncSave(){var ch=false;try{ch=smSync();}catch(e){}if(ch)persist();return ch;}

  /* ---------- arsip bulanan di Drive ---------- */
  function liveMin(){var m=today();Object.keys(S.days).forEach(function(d){if(d<m)m=d;});return m;}
  function arcNeed(f,t){
    if(!SYNC||diffDays(f,t)>RP_SPAN_ARC)return [];
    var lm=liveMin(),to=t<addDays(lm,-1)?t:addDays(lm,-1);
    if(f>to)return [];
    var out=[];for(var m=f.slice(0,7);m<=to.slice(0,7);m=nextMonth(m)){if(arcMonths&&arcMonths.indexOf(m)>=0&&!arcLoaded[m])out.push(m);}
    return out;
  }
  function nextMonth(m){var y=+m.slice(0,4),n=+m.slice(5,7)+1;if(n>12){n=1;y++;}return y+'-'+pad(n);}
  function arcStart(f,t,again){
    if(!SYNC||arcBusy)return;
    if(!arcMonths){
      arcBusy=true;
      google.script.run.withSuccessHandler(function(r){arcBusy=false;if(r&&r.denied){onDenied(r);return;}arcMonths=(r&&r.months)||[];arcFail='';var c=rpDates();arcStart(c.f,c.t);rpRefresh();})
        .withFailureHandler(function(){arcBusy=false;arcMonths=[];arcFail='Arsip lama belum bisa dibuka (offline). Yang tampil: hari yang ada di aplikasi dan ringkasan.';rpRefresh();}).listArchive(KODE);
      return;
    }
    var need=arcNeed(f,t);if(!need.length)return;
    arcBusy=true;
    var m=need[0];
    google.script.run.withSuccessHandler(function(r){
      arcBusy=false;
      if(r&&r.denied){onDenied(r);return;}
      if(r&&r.ok){arcLoaded[m]=1;arcFail='';try{arcAdopt(r.json);}catch(e){}}
      else{arcLoaded[m]=1;arcFail='Arsip '+m+' tidak bisa dibaca. Yang tampil: ringkasan.';}
      var c2=rpDates();arcStart(c2.f,c2.t);rpRefresh();
    }).withFailureHandler(function(){arcBusy=false;arcLoaded[m]=1;arcFail='Arsip '+m+' belum bisa dibuka (offline). Yang tampil: ringkasan.';rpRefresh();}).loadArchive(KODE,m);
  }

  /* ================= RAPORT PERSONAL (hanya head dan admin) =================
     Pola per orang dari data rinci hari-hari yang masih ada di app (sekitar 75 hari terakhir).
     "Sering" = minimal 3 kejadian dalam rentang 7 hari. Tidak ada peringkat dan tidak ada skor gabungan. */
  var pxK='7',pxUid='';
  var PX_RANGES=[['0','Hari ini'],['1','Kemarin'],['7','7 hari'],['30','30 hari']];
  function pxRange(){

    if(pxK==='1'){var y=addDays(T,-1);return {f:y,t:y};}
    if(pxK==='30')return {f:addDays(T,-29),t:T};
    return {f:addDays(T,-6),t:T};

  function pxFreq(ev){
    var u={};ev.forEach(function(x){u[x.D+'|'+x.sh]=x.D;});
    var ds=Object.keys(u).map(function(k){return u[k];}).sort();
    for(var i=0;i+2<ds.length;i++)if(diffDays(ds[i],ds[i+2])<=6)return true;
    return false;
  }
  /* kumpulkan angka dan kejadian satu orang di rentang r */
  function pxCalc(uid,r){

    var kw=NN('kw'),seen={};
    rpEach(r.f,r.t,function(D){
      var d=dayOf(D);if(!d)return;
      var mine=Object.keys(d.att).map(function(k){return d.att[k];}).filter(function(a){return a.uid===uid&&attOk(a)&&a.a;});
      if(!mine.length)return;
      P.days++;
      var row={D:D,sh:'',a:'',late:false,tk:0,note:[]};
      mine.forEach(function(a){
        var jk=JKM[a.jk]||JKM[a.sh],lt=attLate(a);
        P.shifts.push({D:D,sh:a.sh});row.sh+=(row.sh?' + ':'')+SH[a.sh].label;row.a+=(row.a?', ':'')+a.a.replace(':','.');
        if(lt){P.late.push({D:D,sh:a.sh});P.lateMin+=Math.max(0,bizMin(a.a)-minOf(jk.s));row.late=true;row.note.push('telat masuk');}
        /* centang menumpuk: banyak centang dalam rentang 3 menit */
        var tm=[];
        Object.keys(d.en).forEach(function(k){
          var e=d.en[k];if(!e||e.s!=='o'||e.b!==uid||!e.a)return;
          var ks=k.split('|');if(ks[0]!==a.sh)return;
          var t=S.tasks[ks[1]];if(t&&t.ar==='pri')return;
          tm.push(bizMin(e.a));
        });
        P.ticks+=tm.length;row.tk+=tm.length;
        if(tm.length>=6){
          tm.sort(function(x,y){return x-y;});var best=0;
          for(var i=0;i<tm.length;i++){var c=0;for(var j=i;j<tm.length&&tm[j]-tm[i]<=3;j++)c++;if(c>best)best=c;}
          if(best>=6&&best>=tm.length*0.6){P.batch.push({D:D,sh:a.sh,n:best});row.note.push(best+' centang sekaligus');}
        }
      });
      Object.keys(d.ses).forEach(function(k){
        var s=d.ses[k];if(!s||s.own!==uid||!s.sb)return;
        var p=k.split('|');if(p[1]==='pri'||p[1]==='ru')return;
        P.ses++;if(s.ap&&s.ap.res==='ok')P.sesOk++;
        if(s.lt){P.sesLate.push({D:D,sh:p[0]});row.note.push('kirim telat');}
        if(s.rc>0)P.sesRet.push({D:D,sh:p[0]});
      });
      /* cek keliling: dikerjakan orang ini, atau terlewat di shift yang dia pegang sebagai Runner */
      var sl=[];try{sl=ronSlots(D).filter(function(x){return !x.flex&&!x.hd;});}catch(e){sl=[];}
      sl.forEach(function(x){
        if(x.e){
          if(x.e.b!==uid)return;
          if(x.e.lt){P.kl.late.push({D:D,sh:x.sh});row.note.push('keliling '+x.t+' telat');}
          else{P.kl.ok++;if(x.e.a&&bizMin(x.e.a)-x.m>=kw*0.75){P.kl.tight.push({D:D,sh:x.sh});row.note.push('keliling '+x.t+' mepet');}}
          return;
        }
        if(x.st!=='missed')return;
        var here=mine.filter(function(a){return a.sh===x.sh;});if(!here.length)return;
        var runners=Object.keys(d.att).map(function(k){return d.att[k];}).filter(function(a){return a.sh===x.sh&&attOk(a)&&a.ps==='rn';});
        var mineRn=here.some(function(a){return a.ps==='rn';});
        if(runners.length?mineRn:!here.some(function(a){return a.ps==='hb'||a.ps==='hp';})){
          var kk=D+'|'+x.sh+'|'+x.t;if(seen[uid+kk])return;seen[uid+kk]=1;
          P.kl.miss.push({D:D,sh:x.sh,t:x.t});row.note.push('keliling '+x.t+' terlewat');
        }
      });
      P.rows.push(row);
    });
    return P;
  }
  /* kalimat kesimpulan, netral dan tidak menghukum */
  function pxConclude(P,nm){
    var out=[],n=P.shifts.length;
    if(!n)return [{c:'n',x:'Belum ada shift tercatat di rentang ini.'}];
    function uq(a){var u={};a.forEach(function(x){u[x.D+'|'+x.sh]=1;});return Object.keys(u).length;}
    function cnt(a){var q=uq(a);return a.length+' kali'+(q!==a.length?' di '+q+' shift':'');}
    function line(ev,fq,lbl){
      if(!ev.length)return null;
      return {c:fq?'o':'y',x:(fq?'Sering '+lbl:lbl.charAt(0).toUpperCase()+lbl.slice(1))+': '+cnt(ev)+(fq?' (minimal 3 kali dalam seminggu)':'')+'.'};
    }
    var fL=pxFreq(P.late),a=P.late.length;
    if(a)out.push({c:fL?'o':'y',x:(fL?'Sering telat absen di web':'Telat absen di web')+': '+a+' kali dari '+n+' shift, rata-rata '+Math.round(P.lateMin/a)+' menit setelah jam masuk'+(fL?' (minimal 3 kali dalam seminggu).':'.')});

    if(m.length)out.push({c:pxFreq(m)?'o':'y',x:(pxFreq(m)?'Sering ':'')+'ada cek keliling yang terlewat di shift '+nm+' sebagai Runner: '+m.length+' cek di '+uq(m)+' shift'+(pxFreq(m)?' (minimal 3 kali dalam seminggu).':'.')});
    var kt=P.kl.late;
    if(kt.length)out.push(line(kt,pxFreq(kt),'cek keliling dikerjakan telat'));
    var kg=P.kl.tight;
    if(kg.length&&pxFreq(kg))out.push({c:'y',x:'Cek keliling sering diisi mepet di ujung waktu: '+cnt(kg)+' dari '+(P.kl.ok+kt.length)+' cek yang dia kerjakan.'});
    var sl=P.sesLate;
    if(sl.length)out.push(line(sl,pxFreq(sl),'kirim area untuk approval melewati batas'));
    if(P.batch.length)out.push(line(P.batch,pxFreq(P.batch),'tugas dicentang sekaligus dalam beberapa menit (bisa berarti diisi di akhir, bukan saat dikerjakan)'));

  /* ================= MAINTENANCE DAN LANGGANAN =================
     Item (service AC, Spotify, Claude, dll) disimpan di S.kn['m_<id>'], catatan per tanggal di S.kn['n_<tanggal>_<id>'].
     Diisi dan diubah head dan admin di Raport > Maintenance dan langganan. Staf hanya melihat ringkasan jatuh tempo. */
  var MGPDL={0:'Sekali saja',1:'Tiap bulan',3:'Tiap 3 bulan',6:'Tiap 6 bulan',12:'Tiap tahun'};
  var mgForm='',mgDraft={},mgEdit='',mgRec='',mgMsg='',mgDelArm='',mgDelLog='';
  function addMonths(D,n){
    var a=D.split('-'),y=+a[0],m=+a[1]-1+n,dd=+a[2];
    y+=Math.floor(m/12);m=((m%12)+12)%12;
    var last=new Date(y,m+1,0).getDate();if(dd>last)dd=last;
    return y+'-'+pad(m+1)+'-'+pad(dd);
  }
  function mgItems(){
    var out=[];Object.keys(S.kn).forEach(function(k){if(k.indexOf('m_')!==0)return;var e=S.kn[k];if(e&&!e.x)out.push({id:k,e:e});});
    out.sort(function(a,b){
      var x=a.e.nx||'9999-99-99',y=b.e.nx||'9999-99-99';
      return x<y?-1:x>y?1:(a.e.n<b.e.n?-1:1);
    });
    return out;
  }
  function mgLogs(){
    var out=[];Object.keys(S.kn).forEach(function(k){if(k.indexOf('n_')!==0)return;var e=S.kn[k];if(e&&!e.x)out.push({id:k,e:e});});
    out.sort(function(a,b){return a.e.d<b.e.d?1:a.e.d>b.e.d?-1:((b.e.a||'')<(a.e.a||'')?-1:1);});
    return out;
  }
  /* d = hari menuju jatuh tempo (negatif = terlambat), st: over, soon (30 hari), ok, none */
  function mgDue(it,T){
    if(!it.nx)return {d:null,st:'none'};
    var d=diffDays(T,it.nx);
    return {d:d,st:d<0?'over':d<=30?'soon':'ok'};
  }
  function mgDueText(it,T){
    var q=mgDue(it,T);
    if(q.st==='none')return it.pd?'Belum ada jadwal':'Sekali saja';
    if(q.d<0)return 'Terlambat '+(-q.d)+' hari ('+fmtShort(it.nx)+')';
    if(q.d===0)return 'Jatuh tempo hari ini';
    if(q.d===1)return 'Jatuh tempo besok ('+fmtShort(it.nx)+')';
    return 'Jatuh tempo '+fmtShort(it.nx)+' ('+q.d+' hari lagi)';
  }
  function mgDueList(T,maxDays){
    return mgItems().filter(function(x){var q=mgDue(x.e,T);return q.st==='over'||(q.d!=null&&q.d<=maxDays);});
  }
  function mgNames(){var m={};mgItems().forEach(function(x){m[x.id]=x.e;});Object.keys(S.kn).forEach(function(k){if(k.indexOf('m_')===0&&!m[k])m[k]=S.kn[k];});return m;}
  function mgNum(v){var n=parseInt(String(v||'').replace(/\D/g,''),10);return isFinite(n)?n:0;}
  function mgCanEdit(){return !!(me&&(isHead(me)||me.ad));}
  function mgNextDue(it,d){
    if(!it.pd)return '';
    var nx=it.nx?addMonths(it.nx,it.pd):addMonths(d,it.pd),g=0;
    while(nx<=d&&g++<400)nx=addMonths(nx,it.pd);
    return nx;
  }
  function mgSaveItem(){

    var dup=mgItems().some(function(x){return x.id!==mgEdit&&x.e.n.toLowerCase()===n.toLowerCase();});
    if(dup){mgMsg='Nama ini sudah ada di daftar.';return false;}
    var patch={k:f.k==='lg'?'lg':'mt',n:n,pd:f.pd||0,c:mgNum(f.c),nx:f.pd||f.nx?(f.nx||''):'',v:(f.v||'').trim(),nt:(f.nt||'').trim(),x:0};
    var id=mgEdit||('m_'+idn());
    if(!setKn(id,patch)){mgMsg='Data tidak valid.';return false;}
    return true;
  }
  function mgSaveRec(){
    mgCapture();

  /* ================= KALIBRASI (bagian dari Pelaksana) dan ringkasan untuk serah terima ================= */
  var calOpen='',calW=null,calCopy='';
  function kalSh(D){
    if(kShift&&attOf(D,me.id,kShift))return kShift;
    return nowBiz()<bizMin(T('sw'))?'pg':'sr';
  }
  function kalCan(D,sh){
    if(!me||me.ad)return false;
    if(isHead(me))return true;
    var a=attOf(D,me.id,sh);return !!(a&&attOk(a));
  }
  function stClsK(s){return 'st '+stCls(s);}
  function kalPeople(){
    return staffList(false).filter(function(u){return !u.ad&&u.id!==me.id;});
  }
  function copyFx(f){return cleanFx(f);}
  function copyPr(a){return cleanPours(JSON.parse(JSON.stringify(a||[])));}
  /* entri baru: terisi dari resep yang berlaku */
  function kalNew(D,sh,L,prev){
    var w={m:'new',x:0,st:'',b:me.n,uid:me.id,ak:'',a:clockT(),rd:'',p:cleanFx({}),fr:cleanFx({}),ts:{},nt:'',pr:[]};
    if(prev){w.rd=prev.e.rd||'';w.p=copyFx(frOf(prev.e));w.p.fp='';w.pr=copyPr(prev.e.pr);}
    else if(L.kind==='fil'){var r=recOf(L.id.slice(2));w.p=cleanFx({gs:r.gr,ds:r.k,wt:r.a,tp:r.t,tm:r.tt,es:r.es});}
    else{var e=espOf(L.id);if(e)w.p=cleanFx({gs:e.gr});}
    if(L.kind==='fil'&&!w.pr.length)w.pr=copyPr(recOf(L.id.slice(2)).pr);
    return w;
  }
  function kalFinal(w,kind){
    var fr=cleanFx({}),p=w.p||{},f=w.fr||{};
    ['gs','ds','yl','tm','pt','wt','tp','fp','es'].forEach(function(k){fr[k]=numTxt(f[k])||numTxt(p[k]);});
    fr.pi=(f.pi===0||f.pi===1)?f.pi:(p.pi===0||p.pi===1?p.pi:'');
    return fr;
  }
  function kalText(D,sh,id,e){
    var kind=kindOf(id),t=[];
    t.push('KALIBRASI KOPI · '+(kind==='fil'?'Manual brew':'Espresso')+' · '+lineupName(id));
    t.push(fmt(D)+' · Shift '+SH[sh].label);
    t.push('Kalibrator: '+(e.b||'-')+(e.ak?' (didampingi '+nameOf(e.ak)+')':'')+(e.a?' · '+e.a:''));
    if(e.x){t.push('Tidak dipakai hari ini.');return t.join('\n');}
    if(e.rd)t.push('Roast date: '+fmtShort(e.rd)+' (hari ke-'+diffDays(e.rd,D)+')');
    if(e.m==='pakai'){t.push('Memakai resep sebelumnya tanpa perubahan.');}
    else{
      var p=e.p||{};
      t.push('');t.push('Parameter tes: '+recLine(kind,p)+(kind==='esp'&&ratioTxt(p.ds,p.yl)?' · ratio '+ratioTxt(p.ds,p.yl):'')+(kind==='fil'&&ratioTxt(p.ds,p.wt)?' · ratio '+ratioTxt(p.ds,p.wt):''));
      var ts=TSF.filter(function(k){return e.ts&&e.ts[k];}).map(function(k){return TSN[k]+' '+({k:'Kurang',p:'Pas',b:'Berlebih'})[e.ts[k]];});
      if(ts.length)t.push('Rasa: '+ts.join(', '));
    }
    var f=frOf(e);t.push('');t.push('Resep final: '+recLine(kind,f)+(kind==='esp'&&ratioTxt(f.ds,f.yl)?' · ratio '+ratioTxt(f.ds,f.yl):'')+(kind==='fil'&&ratioTxt(f.ds,f.wt)?' · ratio '+ratioTxt(f.ds,f.wt):''));
    if(kind==='fil'&&pourTxt(e.pr))t.push('Tuang: '+(e.pr||[]).filter(function(x){return numTxt(x.a);}).map(function(x){return x.t+' '+numTxt(x.a)+' ml'+(x.w?' ('+x.w+')':'');}).join(' · '));
    if(f.fp)t.push('Profil rasa final: '+f.fp);
    t.push('Status: '+(STK[e.st]||'-'));
    if(e.nt)t.push('Catatan: '+e.nt);
    return t.join('\n');
  }

  /* ringkasan kecil di Checklist: kalibrasinya sendiri ada di panel Kalibrasi */
  /* hitungan untuk kartu ringkas: perlu aksi saya, menunggu rekan */
  function kalSt(D,sh,L){
    var en=kbOf(D,sh,L.id);
    if(!en)return {k:'new',en:null};
    if(en.x)return {k:'skip',en:en};
    if(en.m==='pakai')return {k:'pakai',en:en};
    if(en.sk)return {k:'lewat',en:en};
    var c=kbCf(en);
    return {k:c.st==='cat'?'cat':(c.st==='ok'?'ok':'wait'),en:en,c:c};
  }
  function kalGrp(s,can){
    if(s.k==='new'||s.k==='cat')return can?'act':'wait';
    if(s.k==='wait')return (can&&s.en.uid!==me.id)?'act':'wait';
    return 'done';
  }
  function kalCounts(D,sh,can){
    var r={act:[],wait:[],done:[]};
    kalLineups(sh).forEach(function(L){var s=kalSt(D,sh,L);r[kalGrp(s,can)].push({L:L,s:s});});
    return r;
  }
  var kalGo=false;
  function renderKal(box,D){
    var sh=kalSh(D),lus=kalLineups(sh);
    if(!lus.length||me.ad)return;
    var can=kalCan(D,sh),cn=kalCounts(D,sh,can);
    var done=lus.filter(function(L){var e=kbOf(D,sh,L.id);return e&&!e.x;}).length;
    var card=h('div',{cls:'card',id:'kalLine'});
    card.appendChild(h('div',{cls:'who'},h('h3',{text:'Kalibrasi · Shift '+SH[sh].label}),h('span',{cls:'st '+(done?'setuju':'ajukan'),text:done+' dari '+lus.length})));
    var parts=[];
    if(cn.act.length)parts.push(cn.act.length+' perlu aksi kamu');
    if(cn.wait.length)parts.push(cn.wait.length+' menunggu');
    if(parts.length)card.appendChild(h('p',{cls:'small',id:'kalLineSum',text:parts.join(' · ')}));
    var miss=sh==='pg'?kalMissing(D):[];
    if(miss.length)card.appendChild(h('div',{cls:'banner',id:'kalMiss',text:'Belum dikalibrasi: '+miss.join(', ')+'. Batas jam '+hmDot(bizMin(T('kl')))+'.'}));
    var go=h('button',{type:'button',cls:'btn ghost',id:'bKalOpen',text:cn.act.length?'Mulai dari yang perlu aksi':'Buka Kalibrasi'});
    go.addEventListener('click',function(){
      var f=cn.act[0];
      calW=null;calCopy='';cfNote='';
      if(f&&(f.s.k==='new'||f.s.k==='cat')){calOpen=f.L.id;cfOpen='';}
      else if(f){calOpen='';cfOpen=f.L.id;}
      kalGo=true;showTab('kal');window.scrollTo(0,0);
    });

  function kalSummary(D,s){

  function pendingApprovals(){
    if(!me||!isHead(me))return [];
    var out=[],t=today(),days=[t,addDays(t,-1)];
    days.forEach(function(D){
      SHIFTS.forEach(function(sh){
        if(!canApprove(D,sh.id))return;
        sessionsFor(D,sh.id).forEach(function(it){
          if(it.def.tp==='pri'||it.def.tp==='ru'||!it.ses)return;
          var st=sstat(it.ses,it.def);
          if(st==='ajukan')out.push({D:D,sh:sh.id,it:it,kind:'periksa'});
          else if(me.ad&&it.ses.ap&&it.ses.ap.res==='ok'&&it.ses.ap.self&&!it.ses.ap.cf)out.push({D:D,sh:sh.id,it:it,kind:'konfirmasi'});
        });
      });
    });
    /* permintaan lanjut shift sore */
    days.forEach(function(D){
      var d=dayOf(D);if(!d)return;
      Object.keys(d.att).forEach(function(k){
        var a=d.att[k];
        if(a.sh!=='sr'||a.rq!=='p')return;
        if(lanjutCan(D,a))out.unshift({D:D,sh:'sr',kind:'lanjut',uid:a.uid,att:a});
      });
    });
    return out;
  }

  function blockedApprovals(){

  function analisaData(from,to){
    var t=today(),a={days:0,rIssue:{},rArea:{},rHour:{},rDow:{},rTotal:0,rMiss:0,rTemuan:0,rFixN:0,rFixMin:0,rLate:0,
      rf:{},pp:{},tgDays:0,tgDone:0,tgTotal:0,self:0,selisih:[],bads:0};
    for(var d=from;d<=to&&d<=t;d=addDays(d,1)){
      var day=S.days[d];if(!day)continue;a.days++;
      /* ronde */
      ronSlots(d).forEach(function(x){
        if(!shiftActive(d,x.sh)&&!x.e)return;
        if(!x.e){if(x.st==='missed'){a.rTotal++;a.rMiss++;}return;}
        a.rTotal++;if(x.e.lt)a.rLate++;
        if(x.e.r==='tm'){
          a.rTemuan++;
          x.e.is.forEach(function(i){a.rIssue[i]=(a.rIssue[i]||0)+1;});
          if(!x.e.is.length)a.rIssue['(tanpa jenis)']=(a.rIssue['(tanpa jenis)']||0)+1;
          var al=AR[x.ar].label;a.rArea[al]=(a.rArea[al]||0)+1;
          var hr=x.t.slice(0,2)+'.00';a.rHour[hr]=(a.rHour[hr]||0)+1;
          var dw=HARI[wday(d)];a.rDow[dw]=(a.rDow[dw]||0)+1;
          if(x.e.fx&&x.e.fa&&x.e.a){a.rFixN++;a.rFixMin+=Math.max(0,bizMin(x.e.fa)-bizMin(x.e.a));}
        }
      });
      /* refill */
      Object.keys(day.rf).forEach(function(k){var e=day.rf[k];if(!e.s)return;var ar=k.split('|')[1],lab=(AR[ar]?AR[ar].label:ar)+' · '+e.n;a.rf[lab]=(a.rf[lab]||0)+1;});
      /* prepare */
      ppList(d,'').forEach(function(x){var n=x.e.n||'?';a.pp[n]=(a.pp[n]||0)+1;});
      var tg=prepTarget(d);
      if(tg.length&&d<t){var td=prepTargetDone(d);a.tgDays++;a.tgDone+=td.done;a.tgTotal+=td.total;}
      /* diperiksa sendiri dan selisih kasir */
      Object.keys(day.ses).forEach(function(k){var s=day.ses[k];if(s.ap&&s.ap.res==='ok'&&s.ap.self)a.self++;});
      SHIFTS.forEach(function(sh){var k=kcOf(d,sh.id,'tk');if(k&&typeof k.fz==='number'&&typeof k.tn==='number'){var c=kasCalc(k);a.selisih.push({d:d,s:sh.id,v:c.selisih});}});
    }
    return a;
  }
